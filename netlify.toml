[build]
  # 빌드 명령어 (devDependencies 포함 설치 후 빌드)
  command = "npm install --production=false && npm run build"
  
  # 배포할 디렉토리
  publish = "dist"

[build.environment]
  # Node.js 버전 및 프로덕션 환경 변수
  NODE_VERSION = "18"
  NODE_ENV = "production"

# 리다이렉트는 public/_redirects 한 곳에서 관리 (Netlify가 그 파일을 먼저 읽음)

# 보안 헤더 설정
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'"

# Digital Asset Links JSON 파일 헤더 설정
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Root assetlinks.json 파일 헤더 설정
[[headers]]
  for = "/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Service Worker 캐시 방지
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# 정적 파일 캐싱
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 아이콘 파일 캐싱 (이름에 해시가 없어서 1일)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# PWA 매니페스트 캐싱
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# 폰트 파일 캐싱
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 다른 사이트가 우리 페이지를 iframe으로 감싸지 못하게 (클릭재킹 방지)
# /embed(블로그 위젯)만 빼야 해서 "/*" 대신 페이지마다 지정함 — 새 페이지를 만들면 여기에도 추가
[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/about"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/guide"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/timezone"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/study"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/faq"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/settings"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/privacy"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/time-converter"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/widget"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
